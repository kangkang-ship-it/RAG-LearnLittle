# RAG LearnLittle 前端 nginx 配置
# - SPA 路由回退（try_files → index.html）
# - /api 与 /static 反代后端（SSE 关键: 关闭代理缓冲，否则流式输出会被 nginx 缓冲导致前端收不到增量）
# - 安全响应头（审查 P1: CSP/X-Frame-Options/X-Content-Type-Options）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代（SSE 禁用缓冲）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态头像
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # 安全响应头
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # 保守 CSP（内联样式由前端以 style 属性大量使用，故允许 'unsafe-inline' style）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:;" always;
}

# Agent 配置
agent:
  # 最大迭代次数（Agent 循环次数，每次约 2-3 步节点执行）
  max_iterations: 10
  # 流式输出 chunk 大小（字符数）
  stream_chunk_size: 15
  # 上下文窗口最大轮数（滑动窗口）
  max_history_rounds: 20
  # 连续工具调用上限（无回复产出时强制终止，防止循环调用）
  max_consecutive_tool_calls: 6

# Plan-and-Execute 配置
plan_execute:
  # Plan 阶段
  max_steps: 5                    # 计划最多步骤数
  plan_timeout: 30                # Plan 生成超时（秒），轻量模型建议 30s+
  step_timeout: 90                # 单步执行超时（秒），复杂步骤建议 60s+
  synthesize_timeout: 60          # 综合阶段超时（秒）
  total_timeout: 300              # 总超时（秒），多步骤任务需要更长时间
  # 并行执行
  enable_parallel: true           # 是否并行执行无依赖步骤
  max_parallel_steps: 3           # 最大并行步骤数

# 查询分类配置
classifier:
  # L1 规则层
  rule_complex_keywords:          # 复杂意图关键词/模式
    - "分析.*总结"
    - "对比.*整理"
    - "研究.*归纳"
    - "先.*然后.*再"
    - "计划"
    - "规划"
    - "步骤"
    - "方案"
    - "策略"
    - "综合分析"
    - "系统梳理"
  rule_simple_patterns:           # 简单意图模式
    - "^你好"
    - "^谢谢"
    - "^再见"
    - "^现在.*时间"
  rule_complex_min_length: 200    # 长消息判定阈值（字符数）
  # L1 规则层补充（迁移自 query_classifier.py _rule_classify 的硬编码）
  tool_keywords:                  # 多目标并列判定：命中 ≥3 个 → complex
    - "搜索"
    - "搜索笔记"
    - "统计"
    - "回顾"
    - "创建"
    - "更新"
    - "推荐"
    - "标记"
  condition_patterns:             # 条件分支模式：命中 → complex
    - "如果.*否则"
    - "要么.*要么"
    - "根据.*决定"
  tool_intent_keywords:           # 工具意图词表（短消息判定用）
    - "搜索"
    - "统计"
    - "回顾"
    - "创建"
    - "更新"
    - "推荐"
    - "标记"
    - "时间"
  short_msg_length: 50            # 短消息阈值（字符数，无工具意图时判 simple）
  # L2 LLM 层
  llm_enabled: true               # 是否启用 LLM 精判
  llm_confidence: 0.8             # LLM 判定置信度

# RAG 配置
rag:
  # 是否启用 LLM 文档总结（false=轻量截断，延迟低；true=LLM总结，质量高）
  enable_summarize: true
  # 截断模式下每篇文档最大字符数
  truncate_max_chars: 800

# Token 预算配置
token_budget:
  # 模型上下文窗口大小（token 数）
  model_context_size: 32768
  # 系统提示词预留
  system_prompt: 500
  # RAG 上下文上限
  rag_context_max: 2000
  # 摘要文本上限
  summary_max: 800
  # 工具调用预留
  agent_scratchpad_reserve: 4000
  # 当前输入估算
  current_input_estimate: 300
  # 安全余量
  safety_margin: 1000
  # 多模态（图片/视频）预算
  # 单条消息图片预留（当前消息优先保证）
  image_tokens_per_msg: 3000
  # 历史回放单条消息最多保留的图片数，超出以 "[图片×N]" 占位
  max_history_images: 4

# 工具按需加载配置
tool_groups:
  # 基础工具（每次对话默认加载）
  base:
    - what_time_is_now
    - get_user_info_tools
  # 笔记读取组（搜索/完整内容/统计/推荐）
  note_read:
    - search_notes_tool
    - get_note_content_tool
    - get_note_stats_tool
    - get_related_notes_tool
  # 笔记写入组（创建/更新笔记）
  note_write:
    - create_note_tool
    - update_note_tool
  # 回顾组（回顾管理）
  review:
    - get_today_reviews_tool
    - mark_reviewed_tool
  # 邮箱组（发送邮件，低频操作；当前 default_groups 全量加载，由 LLM 按需选用，
  # 系统提示词已约束"仅当用户要求发送邮件时才调用"。若需真按需加载，见实施文档 P2-6 §6.2）
  email:
    - send_email
  # PPT 生成组（讲解 PPT；不加入 default_groups，保持轻量工具集 ——
  # 命中关键词才加载，qwen3-max 的工具 schema 越少幻觉率越低，见设计方案 §4.2）
  ppt:
    - generate_ppt_tool

# 工具路由规则（关键词 → 工具组映射）
tool_routing:
  # 默认加载的工具组（未命中任何关键词时使用）
  # 全量加载（含 email）：让 LLM 自己决定使用哪个工具，关键词规则仅作为加速补充，
  # 避免关键词穷举不完整导致"想用工具却没有"的问题。
  # 系统提示词已约束"仅当用户要求发送邮件时才调用 send_email"。
  default_groups:
    - base
    - note_read
    - note_write
    - review
    - email
  # 关键词 → 工具组映射（命中后追加对应组）
  keyword_rules:
    note_write:
      # 创建意图
      - "创建"
      - "新建"
      - "写笔记"
      - "写一条"
      - "记录"
      - "添加笔记"
      - "帮我写"
      - "帮我记"
      - "记下来"
      - "保存"
      - "存一下"
      - "帮我整理"
      - "整理成笔记"
      - "做个笔记"
      - "归纳"
      - "总结成笔记"
      # 编辑/更新意图
      - "修改"
      - "编辑"
      - "更新"
      - "改一下"
      - "改成"
      - "改为"
      - "替换"
      - "补充"
      - "追加"
      - "删除笔记"
      - "帮我改"
    review:
      - "回顾"
      - "复习"
      - "review"
      - "待回顾"
      - "回顾完成"
    note_read:
      - "搜索"
      - "查找"
      - "找笔记"
      - "查笔记"
      - "总结"
      - "统计"
      - "有哪些"
      - "关联"
      - "推荐"
    email:
      - "发送邮件"
      - "发邮件"
      - "发到邮箱"
      - "发送到邮箱"
      - "导出到邮箱"
      - "邮件发送"
      - "发送到"
      - "发送至"
      - "发给"
      - "发到"
      - "转发"
      - "email"
    ppt:
      # 只用组合词（"讲解"单独用误伤率高，如「帮我讲解一下这个概念」），见设计方案 §4.2
      - "PPT"
      - "ppt"
      - "幻灯片"
      - "演示文稿"
      - "做个ppt"
      - "生成ppt"
      - "讲解ppt"
      - "整理成ppt"

# 安全配置（P2-3 安全护栏）
security:
  # send_email 每用户每小时发送上限（进程内滑动窗口；多进程部署需换 Redis）
  email_rate_limit_per_hour: 10

# 记忆压缩配置
memory_compression:
  # 触发摘要的消息数阈值
  summarize_threshold: 40
  # 两次摘要之间的最小间隔（消息数）
  min_summary_interval: 20
  # 摘要最大 token 数
  summary_max_tokens: 800
  # 保留最近不压缩的消息数
  keep_recent: 20

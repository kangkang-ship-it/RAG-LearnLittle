# Agent 配置
agent:
  # 最大迭代次数（Agent 循环次数，每次约 2-3 步节点执行）
  max_iterations: 10
  # 流式输出 chunk 大小（字符数）
  stream_chunk_size: 15
  # 上下文窗口最大轮数（滑动窗口）
  max_history_rounds: 20
  # 连续工具调用上限（无回复产出时强制终止，防止循环调用）
  max_consecutive_tool_calls: 6

# Plan-and-Execute 配置
plan_execute:
  # Plan 阶段
  max_steps: 5                    # 计划最多步骤数
  plan_timeout: 30                # Plan 生成超时（秒），轻量模型建议 30s+
  step_timeout: 90                # 单步执行超时（秒），复杂步骤建议 60s+
  synthesize_timeout: 60          # 综合阶段超时（秒）
  total_timeout: 300              # 总超时（秒），多步骤任务需要更长时间
  # 并行执行
  enable_parallel: true           # 是否并行执行无依赖步骤
  max_parallel_steps: 3           # 最大并行步骤数

# 查询分类配置
classifier:
  # L1 规则层
  rule_complex_keywords:          # 复杂意图关键词/模式
    - "分析.*总结"
    - "对比.*整理"
    - "研究.*归纳"
    - "先.*然后.*再"
    - "计划"
    - "规划"
    - "步骤"
    - "方案"
    - "策略"
    - "综合分析"
    - "系统梳理"
  rule_simple_patterns:           # 简单意图模式
    - "^你好"
    - "^谢谢"
    - "^再见"
    - "^现在.*时间"
  rule_complex_min_length: 200    # 长消息判定阈值（字符数）
  # L2 LLM 层
  llm_enabled: true               # 是否启用 LLM 精判
  llm_confidence: 0.8             # LLM 判定置信度

# RAG 配置
rag:
  # 是否启用 LLM 文档总结（false=轻量截断，延迟低；true=LLM总结，质量高）
  enable_summarize: true
  # 截断模式下每篇文档最大字符数
  truncate_max_chars: 800

# Token 预算配置
token_budget:
  # 模型上下文窗口大小（token 数）
  model_context_size: 32768
  # 系统提示词预留
  system_prompt: 500
  # RAG 上下文上限
  rag_context_max: 2000
  # 摘要文本上限
  summary_max: 800
  # 工具调用预留
  agent_scratchpad_reserve: 4000
  # 当前输入估算
  current_input_estimate: 300
  # 安全余量
  safety_margin: 1000

# 工具按需加载配置
tool_groups:
  # 基础工具（每次对话默认加载）
  base:
    - what_time_is_now
    - get_user_info_tools
  # 笔记读取组（搜索/统计/推荐）
  note_read:
    - search_notes_tool
    - get_note_stats_tool
    - get_related_notes_tool
  # 笔记写入组（创建/更新笔记）
  note_write:
    - create_note_tool
    - update_note_tool
  # 回顾组（回顾管理）
  review:
    - get_today_reviews_tool
    - mark_reviewed_tool

# 工具路由规则（关键词 → 工具组映射）
tool_routing:
  # 默认加载的工具组（未命中任何关键词时使用）
  default_groups:
    - base
    - note_read
  # 关键词 → 工具组映射（命中后追加对应组）
  keyword_rules:
    note_write:
      # 创建意图
      - "创建"
      - "新建"
      - "写笔记"
      - "写一条"
      - "记录"
      - "添加笔记"
      - "帮我写"
      - "帮我记"
      - "记下来"
      - "保存"
      - "存一下"
      - "帮我整理"
      - "整理成笔记"
      - "做个笔记"
      - "归纳"
      - "总结成笔记"
      # 编辑/更新意图
      - "修改"
      - "编辑"
      - "更新"
      - "改一下"
      - "改成"
      - "改为"
      - "替换"
      - "补充"
      - "追加"
      - "删除笔记"
      - "帮我改"
    review:
      - "回顾"
      - "复习"
      - "review"
      - "待回顾"
      - "回顾完成"
    note_read:
      - "搜索"
      - "查找"
      - "找笔记"
      - "查笔记"
      - "总结"
      - "统计"
      - "有哪些"
      - "关联"
      - "推荐"

# 记忆压缩配置
memory_compression:
  # 触发摘要的消息数阈值
  summarize_threshold: 40
  # 两次摘要之间的最小间隔（消息数）
  min_summary_interval: 20
  # 摘要最大 token 数
  summary_max_tokens: 800
  # 保留最近不压缩的消息数
  keep_recent: 20

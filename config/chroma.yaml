# ChromaDB 配置
chroma:
  # 持久化存储路径
  persist_directory: "data/chroma"
  
  # 集合配置
  collections:
    rag: "rag_collection"         # 知识库文档向量集合
    notes: "notes_collection"     # 笔记向量集合
  
  # 文本切片参数
  text_splitter:
    chunk_size: 1024
    chunk_overlap: 150
    # 相邻片段 embedding 余弦相似度阈值，超过此值自动合并
    merge_similarity_threshold: 0.85
  
  # 支持的文件类型
  supported_file_types:
    - "application/pdf"
    - "text/markdown"
    - "text/plain"

  # BM25 混合召回（与向量结果 RRF 融合，中文按字符二元组切词）
  bm25:
    enabled: true
    rrf_k: 60

  # 重排序模型
  reranker:
    model_name: "BAAI/bge-reranker-v2-m3"

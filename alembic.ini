# Alembic config (RAG LearnLittle)
# DB URL is reused from app.db.database.DATABASE_URL in alembic/env.py,
# so sqlalchemy.url is intentionally NOT set here (avoids config drift).
# NOTE: keep this file ASCII-only (configparser reads with locale encoding,
# non-ASCII comments break on GBK-locale Windows).
# Usage:
#   generate:  alembic revision --autogenerate -m "description"
#   apply:     alembic upgrade head
# init_db() in app/db/database.py runs `upgrade head` automatically on startup.

[alembic]
script_location = alembic
prepend_sys_path = .

# generated file naming: <rev>_<slug>
file_template = %%(rev)s_%%(slug)s

# logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

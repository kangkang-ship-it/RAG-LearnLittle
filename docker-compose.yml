# ========== RAG LearnLittle 本地一键部署（Docker Compose） ==========
# 用法:
#   1. cp .env.example .env 并按需配置（JWT_SECRET 必填强随机值）
#   2. docker compose up -d --build
#   3. 访问 http://localhost/ （前端，nginx 反代 /api）
#
# 说明:
# - 后端 8000 端口仅暴露给本机（供调试/API 直连）；外部访问统一走前端 nginx
# - APP_ENV 默认 development（自动创建测试账号）；生产请用 docker-compose.prod.yml 覆盖
# - 重排序模型: 本地已缓存时挂载 $HOME/.cache/huggingface 卷即可复用

services:
  mysql:
    image: mysql:8.0
    container_name: raglearn-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-raglearn}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: raglearn-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: raglearn-backend
    env_file:
      - .env
    environment:
      # 覆盖 .env 中的 localhost 指向容器服务名
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      APP_ENV: ${APP_ENV:-development}
      UVICORN_RELOAD: "false"
      # 生产提示: 前端同源反代无需 CORS，直连 8000 调试时才需要
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - ./data:/app/data          # ChromaDB 向量库 + 上传文件（持久化）
      - ./logs:/app/logs          # 日志（持久化）
      # 重排序模型缓存复用：把本地 ~/.cache/huggingface 拷到 ./huggingface_cache，
      # 或设置 HF_CACHE_DIR 指向已有缓存目录（避免容器内重复下载 1GB 模型）
      - ${HF_CACHE_DIR:-./huggingface_cache}:/root/.cache/huggingface
    ports:
      - "8000:8000"               # 仅本机调试用；生产建议移除，统一走 nginx
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./front
    container_name: raglearn-front
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱验证码</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f6f8; font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f6f8; padding: 32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);">
                    <!-- Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #1677ff 0%, #0e5fd8 100%); padding: 32px 40px; text-align: center;">
                            <div style="font-size: 22px; font-weight: 600; color: #ffffff;">{{app_name}}</div>
                            <div style="margin-top: 6px; font-size: 13px; color: rgba(255, 255, 255, 0.85);">邮箱验证码</div>
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding: 40px 40px 32px;">
                            <div style="font-size: 15px; color: #333333; line-height: 1.7;">您好：</div>
                            <div style="margin-top: 12px; font-size: 15px; color: #333333; line-height: 1.7;">
                                您正在{{app_name}}进行邮箱验证，本次验证码为：
                            </div>
                            <div style="margin: 28px 0; padding: 20px; background-color: #f0f6ff; border-radius: 8px; text-align: center; font-size: 34px; font-weight: 700; letter-spacing: 8px; color: #1677ff;">
                                {{code}}
                            </div>
                            <div style="font-size: 13px; color: #888888; line-height: 1.7;">
                                验证码 <b style="color: #555555;">{{expire_minutes}}</b> 分钟内有效，请尽快完成验证。
                                如非本人操作，请忽略本邮件，并注意保护账号安全。
                            </div>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 0 40px 32px; text-align: center;">
                            <div style="border-top: 1px solid #eeeeee; padding-top: 20px; font-size: 12px; color: #aaaaaa;">
                                此邮件由{{app_name}}系统自动发送，请勿直接回复。
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
